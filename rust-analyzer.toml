# cargo dev already compiles the saved exercise. A second workspace-wide
# cargo check is what blows RAM on this repo.
checkOnSave = false

[check]
workspace = false
extraArgs = ["--jobs", "2"]

[cargo]
allTargets = false
targetDir = true

[cargo.buildScripts]
overrideCommand = [
  "cargo",
  "check",
  "--quiet",
  "--message-format=json",
  "--keep-going",
  "-p",
  "runner",
  "--jobs",
  "2",
]

[cachePriming]
enable = false

[files]
exclude = ["solutions", "target", ".checks-backup", ".stub-backups"]
